name: Require PR Approval

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  check-approval:
    name: Check at least 1 approval
    runs-on: ubuntu-latest

    steps:
      - name: Check for approved reviews
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request
                ? context.payload.pull_request.number
                : context.payload.review.pull_request.number,
            });

            const latestReviews = {};
            for (const review of reviews) {
              if (review.state !== 'COMMENTED') {
                latestReviews[review.user.login] = review.state;
              }
            }

            const approvals = Object.values(latestReviews).filter(
              (state) => state === 'APPROVED'
            );

            if (approvals.length < 1) {
              core.setFailed(
                `❌ Se requiere al menos 1 aprobación para hacer merge a master. Aprobaciones actuales: ${approvals.length}`
              );
            } else {
              core.info(
                `✅ PR aprobado por ${approvals.length} revisor(es). Puede continuar con el merge.`
              );
            }

